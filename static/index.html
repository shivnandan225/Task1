<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Price Predictor</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>🚗 Car Price Predictor</h1>

        <p class="subtitle">
            Enter the car details to predict its price
        </p>

        <form id="predictionForm">

            <div class="form-grid">

                <div class="input-box">
                    <label>Symboling</label>
                    <input type="number" id="symboling" step="any" required>
                </div>

                <div class="input-box">
                    <label>Wheelbase</label>
                    <input type="number" id="wheelbase" step="any" required>
                </div>

                <div class="input-box">
                    <label>Car Length</label>
                    <input type="number" id="carlength" step="any" required>
                </div>

                <div class="input-box">
                    <label>Car Width</label>
                    <input type="number" id="carwidth" step="any" required>
                </div>

                <div class="input-box">
                    <label>Engine Size</label>
                    <input type="number" id="enginesize" step="any" required>
                </div>

                <div class="input-box">
                    <label>Bore Ratio</label>
                    <input type="number" id="boreratio" step="any" required>
                </div>

                <div class="input-box">
                    <label>Horsepower</label>
                    <input type="number" id="horsepower" step="any" required>
                </div>

                <div class="input-box">
                    <label>Peak RPM</label>
                    <input type="number" id="peakrpm" step="any" required>
                </div>

                <div class="input-box">
                    <label>City MPG</label>
                    <input type="number" id="citympg" step="any" required>
                </div>

                <div class="input-box">
                    <label>Highway MPG</label>
                    <input type="number" id="highwaympg" step="any" required>
                </div>

            </div>

            <button type="submit">
                Predict Car Price
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
